[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swift-cf-approx"
version = "0.1.0"
description = "Cold Fusion-style approximate fine-tune scaffold on dequantized Swift-Bonsai-2"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "cybort" }]
dependencies = [
  "numpy>=1.26",
  "safetensors>=0.4.5",
  "pyyaml>=6.0",
  "huggingface_hub>=0.26",
  "httpx>=0.27",
  "tqdm>=4.66",
  "gguf>=0.14",
]

[project.optional-dependencies]
train = [
  "torch>=2.4",
  "transformers>=4.46",
  "datasets>=3.0",
  "accelerate>=1.0",
  "peft>=0.13",
  "bitsandbytes>=0.44",
  "trl>=0.12",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
swift-cf = "swift_cf_approx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
